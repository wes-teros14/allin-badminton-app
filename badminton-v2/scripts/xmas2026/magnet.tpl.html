<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ref Magnet Frames</title>
<style>
  :root{--ui-bg:#f4f1f6;--ui-ink:#1b1220;--ui-mut:#6b6577;--ui-line:#ddd5e3;--pur:#6f3e87;--gold:#b8862b;--gold-soft:#fbf3e2;--silver:#7d8591;--bronze:#a8643a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ui-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
  .bar h1{font-size:15px;margin:0 8px 0 0}
  .seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ui-ink)}
  .seg button+button{border-left:1px solid var(--ui-line)}
  .seg button[aria-pressed=true]{background:var(--pur);color:#fff}
  .lbl{font-size:12px;color:var(--ui-mut);margin-right:6px}
  .note{font-size:12px;color:var(--ui-mut);padding:10px 16px 0;max-width:1100px}
  .note b{color:var(--ui-ink)}
  .grid{display:flex;flex-wrap:wrap;gap:28px;padding:18px 16px 40px}
  figure{margin:0}
  figcaption{font-size:13px;margin-top:8px}
  figcaption b{display:block}
  figcaption span{color:var(--ui-mut);font-size:12px}
  .box{position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .mag{position:absolute;left:0;top:0;width:600px;height:900px;transform-origin:0 0;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  .mag svg{position:absolute;inset:0}
  .dl{margin-top:6px;border:1px solid var(--ui-line);background:#fff;border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  .guides{position:absolute;inset:0;pointer-events:none}

  /* stats panel (600 x 900 design px = 2 x 3 in at 300 dpi) */
  .panel{position:absolute;left:30px;right:30px;bottom:30px;background:#fffdfb;border-radius:16px;overflow:hidden;color:#1b1220;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .ph{position:relative;display:flex;align-items:center;gap:12px;background:var(--pur);color:#fff;padding:10px 16px 15px}
  .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#b3262e 0 12px,#fff 12px 24px,#2e7d4f 24px 36px,#fff 36px 48px)}
  .ph img{width:46px;height:46px;border-radius:10px}
  .ph h2{margin:0;font-size:36px;line-height:1}
  .ph .tg{font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.88;margin-top:3px}
  .tt{margin-left:auto;display:flex;gap:18px;text-align:center}
  .tt b{display:block;font-size:30px;line-height:1}
  .tt b.g{color:#f3cf7a}
  .tt span{font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
  /* highlights */
  .hl{display:grid;grid-template-columns:repeat(3,1fr)}
  .hl div{position:relative;padding:10px 10px 11px;border-right:1px solid #ece6f0;border-bottom:1px solid #ece6f0;text-align:center}
  .hl div:nth-child(3n){border-right:0}
  .hl div:nth-child(n+4){border-bottom:0}
  .hl div.p1{background:var(--gold-soft)}
  .hl em{position:absolute;left:8px;top:8px;font-style:normal;font-size:14px;font-weight:700;color:#fff;background:var(--gold);border-radius:10px;padding:1px 7px}
  .hl div.p2 em{background:var(--silver)}
  .hl strong{display:block;font-size:40px;line-height:1.05;color:var(--pur);font-variant-numeric:tabular-nums}
  .hl small{display:block;font-size:19px;line-height:1.15;margin-top:3px}
  /* full table */
  .cols{display:grid;grid-template-columns:1fr 1fr}
  .cols table+table{border-left:1px solid #ece6f0}
  .cols table{width:100%;border-collapse:collapse}
  .cols th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pur);padding:6px 8px 3px;border-bottom:1px solid #ece6f0}
  .cols td{font-size:15.5px;padding:3.5px 5px;border-bottom:1px solid #ece6f0;white-space:nowrap}
  .cols tr:last-child td{border-bottom:0}
  .cols td:first-child{padding-left:8px;width:40px}
  .cols td:last-child{padding-right:8px;text-align:right;font-weight:600}
  .cols tr.p1 td{background:var(--gold-soft)}
  .m{display:inline-block;min-width:34px;border-radius:9px;text-align:center;font-size:12.5px;font-weight:700;color:#fff;padding:0 2px}
  .p1 .m{background:var(--gold)} .p2 .m{background:var(--silver)} .p3 .m{background:var(--bronze)} .pn .m{color:var(--ui-mut)}
</style>
</head>
<body>
<div class="bar">
  <h1>Ref magnet · 2 × 3 in</h1>
  <span><span class="lbl">Stats card</span><span class="seg" id="sStats"><button data-v="off" aria-pressed="true">Off (frame only)</button><button data-v="hl" aria-pressed="false">Highlights</button><button data-v="full" aria-pressed="false">Full list</button></span></span>
  <span><span class="lbl">View</span><span class="seg" id="sSize"><button data-v="fit" aria-pressed="true">Large</button><button data-v="real" aria-pressed="false">≈ Print size</button></span></span>
  <span><span class="lbl">Print guides</span><span class="seg" id="sGuide"><button data-v="off" aria-pressed="true">Off</button><button data-v="on" aria-pressed="false">On</button></span></span>
</div>
<p class="note" id="note"></p>
<div class="grid" id="grid"></div>

<script>
const LOGO = "data:image/png;base64,{{LOGO}}";
const W = 600, H = 900;                 // 2 x 3 in at 300 dpi
const PHOTO = {x:40, y:78, w:520, h:762, r:18};
const SHOW = ["candy","snow"];   // B and C kept in the code, hidden
const opts = {stats:"off", size:"fit", guide:"off"};
let HOLE = false;   // true while exporting: photo window left transparent

/* ---------- tiny seeded random so art is identical every render ---------- */
function rng(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }

/* ---------- reusable SVG pieces ---------- */
const svgShuttle = (x,y,rot,s,feather="#fff",band="#6f3e87") => `
  <g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <path d="M-20 -46 L20 -46 L8 0 L-8 0Z" fill="${feather}" stroke="#1b1220" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-10 -46 L-4 0 M0 -46 L0 0 M10 -46 L4 0" stroke="#1b1220" stroke-width="1.5" opacity=".45"/>
    <rect x="-10" y="-6" width="20" height="6" fill="${band}" stroke="#1b1220" stroke-width="2"/>
    <path d="M-9 0 A9 9 0 0 0 9 0Z" fill="#f2e3c6" stroke="#1b1220" stroke-width="2.5"/>
  </g>`;
const svgRacket = (x,y,rot,s,frame="#6f3e87") => `
  <g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <ellipse cx="0" cy="-62" rx="27" ry="36" fill="url(#strings)" stroke="${frame}" stroke-width="6"/>
    <ellipse cx="0" cy="-62" rx="27" ry="36" fill="none" stroke="#1b1220" stroke-width="1.5" opacity=".5"/>
    <path d="M0 -26 L0 22" stroke="#1b1220" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="20" width="12" height="40" rx="5" fill="${frame}" stroke="#1b1220" stroke-width="2"/>
  </g>`;
const svgOrn = (x,y,r,c,len=0) => `
  <g>${len?`<path d="M${x} ${y-r-6-len} V${y-r-6}" stroke="#d9b45a" stroke-width="2"/>`:""}
    <rect x="${x-r*.3}" y="${y-r-7}" width="${r*.6}" height="7" rx="2" fill="#d9b45a" stroke="#1b1220" stroke-width="1.5"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#1b1220" stroke-width="2.5"/>
    <ellipse cx="${x-r*.35}" cy="${y-r*.35}" rx="${r*.22}" ry="${r*.32}" fill="#fff" opacity=".55" transform="rotate(35 ${x-r*.35} ${y-r*.35})"/>
  </g>`;
const leaf = "M0 0 C6 -9 13 -6 16 -12 C19 -6 26 -9 30 -10 C28 -4 34 0 40 0 C34 0 28 4 30 10 C26 9 19 6 16 12 C13 6 6 9 0 0Z";
const svgHolly = (x,y,rot,s) => `
  <g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <path d="${leaf}" fill="#2f8a4a" stroke="#123b22" stroke-width="2" transform="rotate(-25)"/>
    <path d="${leaf}" fill="#3aa15a" stroke="#123b22" stroke-width="2" transform="rotate(205)"/>
    <circle cx="-4" cy="-6" r="7" fill="#d4262f" stroke="#5a0d12" stroke-width="2"/>
    <circle cx="6" cy="-3" r="7" fill="#d4262f" stroke="#5a0d12" stroke-width="2"/>
    <circle cx="0" cy="6" r="7" fill="#d4262f" stroke="#5a0d12" stroke-width="2"/>
  </g>`;
const svgBow = (x,y,s,c="#d4262f",knot="#f3cf7a") => `
  <g transform="translate(${x} ${y}) scale(${s})" stroke="#1b1220" stroke-width="2.5" stroke-linejoin="round">
    <path d="M0 0 C-14 -26 -44 -24 -40 -4 C-38 10 -14 6 0 0Z" fill="${c}"/>
    <path d="M0 0 C14 -26 44 -24 40 -4 C38 10 14 6 0 0Z" fill="${c}"/>
    <path d="M-4 4 L-22 40 L-12 36 L-8 46 L2 6Z" fill="${c}"/>
    <path d="M4 4 L22 40 L12 36 L8 46 L-2 6Z" fill="${c}"/>
    <circle r="9" fill="${knot}"/>
  </g>`;
const svgSnow = (x,y,s,c="#fff",o=.9) => `
  <g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="2.2" stroke-linecap="round" opacity="${o}">
    <path d="M0 -10V10M-8.7 -5L8.7 5M-8.7 5L8.7 -5"/>
    <path d="M-3 -7.5L0 -10L3 -7.5M-3 7.5L0 10L3 7.5" fill="none"/>
  </g>`;
const svgGift = (x,y,w,h,c,rib) => `
  <g stroke="#1b1220" stroke-width="2.5">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/>
    <rect x="${x+w/2-5}" y="${y}" width="10" height="${h}" fill="${rib}"/>
    <rect x="${x-4}" y="${y-10}" width="${w+8}" height="12" rx="2" fill="${c}"/>
    <rect x="${x+w/2-5}" y="${y-10}" width="10" height="12" fill="${rib}"/>
  </g>`;

/* photo slot: placeholder you replace in your editor */
function photoSlot(matte, ring){
  const p = PHOTO;
  return `
  <defs>
    <clipPath id="pc"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.r}"/></clipPath>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6f63"/><stop offset=".62" stop-color="#3f8f7c"/><stop offset=".62" stop-color="#2e6aa3"/><stop offset="1" stop-color="#245a8c"/></linearGradient>
  </defs>
  ${HOLE ? `<path fill-rule="evenodd" fill="${matte}" stroke="${ring}" stroke-width="3" d="${rr(p.x-9,p.y-9,p.w+18,p.h+18,p.r+8)} ${rr(p.x,p.y,p.w,p.h,p.r)}"/>`
         : `<rect x="${p.x-9}" y="${p.y-9}" width="${p.w+18}" height="${p.h+18}" rx="${p.r+8}" fill="${matte}" stroke="${ring}" stroke-width="3"/>`}
  ${HOLE ? "" : `<g clip-path="url(#pc)">
    <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="url(#pg)"/>
    <path d="M${p.x} ${p.y+300} H${p.x+p.w}" stroke="#fff" stroke-width="3" opacity=".5"/>
    ${[[140,250,1],[230,235,1.1],[330,240,1.15],[420,250,1.05],[505,262,.95]].map(([cx,cy,s])=>`
      <g opacity=".42" fill="#0e2a26"><circle cx="${cx}" cy="${cy}" r="${30*s}"/><rect x="${cx-46*s}" y="${cy+36*s}" width="${92*s}" height="${200*s}" rx="${34*s}"/></g>`).join("")}
    <text x="${p.x+p.w/2}" y="${p.y+120}" text-anchor="middle" fill="#fff" font-size="34" font-weight="700" opacity=".9">PHOTO</text>
    <text x="${p.x+p.w/2}" y="${p.y+152}" text-anchor="middle" fill="#fff" font-size="17" opacity=".85">slot ${p.w} × ${p.h} px · ${(p.w/300).toFixed(2)} × ${(p.h/300).toFixed(2)} in</text>
  </g>`}`;
}
const rr = (x,y,w,h,r) => `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;

/* ---------- the four borders ---------- */
const THEMES = [
 { id:"candy", name:"A · Candy Cane", sub:"Red & white stripe, holly corners, green bow",
   art(){
     const r = rng(7); let snow="";
     return `
     <defs>
       <pattern id="cc" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
         <rect width="34" height="34" fill="#fff"/><rect width="17" height="34" fill="#c62828"/>
       </pattern>
       <pattern id="strings" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e9f6f2"/><path d="M0 0H7M0 0V7" stroke="#7aa9a0" stroke-width="1.2"/></pattern>
     </defs>
     <rect width="${W}" height="${H}" fill="url(#cc)"/>
     <rect x="16" y="16" width="${W-32}" height="${H-32}" rx="26" fill="none" stroke="#fff" stroke-width="10"/>
     <rect x="16" y="16" width="${W-32}" height="${H-32}" rx="26" fill="none" stroke="#1b1220" stroke-width="2.5"/>
     ${photoSlot("#fff","#1b1220")}
     ${svgShuttle(300,H-22,-90,.5,"#fff","#c62828")}
     <!--OVER-->
     <g id="rkt">${svgRacket(RKT.candy.x,RKT.candy.y,RKT.candy.rot,RKT.candy.s,"#6f3e87")}</g>
     ${shuttles("candy")}
     ${svgHolly(548,52,200,1.15)}
     ${svgHolly(44,H-44,20,1.15)}${svgHolly(556,H-44,160,1.15)}
     ${svgBow(300,46,1.15,"#2e7d4f")}
`;
   }},
 { id:"lights", name:"B · Fairy Lights", sub:"Night purple, snow, string lights, “Merry Smashmas”",
   art(){
     const r = rng(11); const p = PHOTO;
     let snow = ""; for(let i=0;i<70;i++){ const x=r()*W, y=r()*H; snow += `<circle cx="${x}" cy="${y}" r="${1+r()*2.4}" fill="#fff" opacity="${.35+r()*.5}"/>`; }
     // wire around photo, bulbs every ~42 px
     const o = 20, L = p.x-o, T = p.y-o, R = p.x+p.w+o, B = p.y+p.h+o;
     const pts=[]; const step=42;
     const per = [[L,T,R,T],[R,T,R,B],[R,B,L,B],[L,B,L,T]];
     per.forEach(([x1,y1,x2,y2])=>{const len=Math.hypot(x2-x1,y2-y1);const n=Math.round(len/step);for(let i=0;i<n;i++){pts.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,x1===x2?(x1===L?-90:90):(y1===T?0:180)]);}});
     let wire = `M${pts[0][0]} ${pts[0][1]}`;
     for(let i=1;i<=pts.length;i++){const a=pts[i-1],b=pts[i%pts.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;const nx=a[2]===0?0:a[2]===180?0:(a[2]===-90?-8:8),ny=a[2]===0?-8:a[2]===180?8:0;wire+=` Q${mx+nx} ${my+ny} ${b[0]} ${b[1]}`;}
     const cols=["#f3cf7a","#ff5a6a","#58d68d","#6fd3ff","#ff9de0"];
     const bulbs = pts.map(([x,y,a],i)=>{const c=cols[i%cols.length];return `
       <g transform="translate(${x} ${y}) rotate(${a+180})">
         <circle cy="12" r="14" fill="${c}" opacity=".28"/>
         <rect x="-4" y="-2" width="8" height="7" rx="1.5" fill="#3b2a52" stroke="#1b1220" stroke-width="1.2"/>
         <ellipse cy="13" rx="6.5" ry="9" fill="${c}" stroke="#1b1220" stroke-width="1.4"/>
         <ellipse cx="-2" cy="10" rx="1.8" ry="3.5" fill="#fff" opacity=".7"/>
       </g>`;}).join("");
     return `
     <defs>
       <linearGradient id="nb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1f5c"/><stop offset="1" stop-color="#160b26"/></linearGradient>
       <pattern id="strings" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#efe6f8"/><path d="M0 0H7M0 0V7" stroke="#a48cc0" stroke-width="1.2"/></pattern>
     </defs>
     <rect width="${W}" height="${H}" fill="url(#nb)"/>${snow}
     ${photoSlot("#f7f1ff","#f3cf7a")}
     <path d="${wire}" fill="none" stroke="#1b1220" stroke-width="2.4"/>
     ${bulbs}
     <text x="${W/2}" y="44" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="34" fill="#f3cf7a" stroke="#1b1220" stroke-width="1" paint-order="stroke">Merry Smashmas</text>
     ${svgSnow(70,38,1.3,"#fff")}${svgSnow(530,38,1.3,"#fff")}
     ${svgSnow(40,H-30,1.1,"#fff")}${svgSnow(560,H-30,1.1,"#fff")}`;
   }},
 { id:"garland", name:"C · Evergreen Garland", sub:"Pine garland, berries, baubles, crossed rackets",
   art(){
     const r = rng(23); const p = PHOTO; let g="";
     const greens=["#1f6b3a","#2f8a4a","#3aa15a","#185a30","#4fb26a"];
     const o = 14, L=p.x-o, T=p.y-o, R=p.x+p.w+o, B=p.y+p.h+o;
     const walk = (x1,y1,x2,y2) => { const len=Math.hypot(x2-x1,y2-y1); for(let d=0; d<len; d+=3.2){ const x=x1+(x2-x1)*d/len, y=y1+(y2-y1)*d/len;
         for(let k=0;k<2;k++){ const a=r()*Math.PI*2, l=11+r()*12; g+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(Math.cos(a)*l).toFixed(1)} ${(Math.sin(a)*l).toFixed(1)}" stroke="${greens[(r()*5)|0]}" stroke-width="${(2+r()*1.6).toFixed(1)}" stroke-linecap="round"/>`; } } };
     walk(L,T,R,T); walk(R,T,R,B); walk(L,T,L,B); walk(L,B,R,B);
     let dec="";
     const spots=[]; const per=[[L,T,R,T],[R,T,R,B],[L,B,R,B],[L,T,L,B]];
     per.forEach(([x1,y1,x2,y2],si)=>{const len=Math.hypot(x2-x1,y2-y1);for(let d=40; d<len-20; d+=62){spots.push([x1+(x2-x1)*d/len,y1+(y2-y1)*d/len]);}});
     spots.forEach(([x,y],i)=>{ if(i%3===1) dec+=svgOrn(x,y+4,10,["#f3cf7a","#6f3e87","#d4262f"][i%3===1?(i/3|0)%3:0]);
       else dec+=`<circle cx="${x-5}" cy="${y-3}" r="5.5" fill="#d4262f" stroke="#5a0d12" stroke-width="1.5"/><circle cx="${x+4}" cy="${y-5}" r="5.5" fill="#d4262f" stroke="#5a0d12" stroke-width="1.5"/><circle cx="${x}" cy="${y+4}" r="5.5" fill="#d4262f" stroke="#5a0d12" stroke-width="1.5"/>`; });
     let dots=""; for(let i=0;i<55;i++){dots+=`<circle cx="${r()*W}" cy="${r()*H}" r="${1.2+r()*1.8}" fill="#fff" opacity=".5"/>`;}
     return `
     <defs><pattern id="strings" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e6f4ea"/><path d="M0 0H7M0 0V7" stroke="#86b596" stroke-width="1.2"/></pattern></defs>
     <rect width="${W}" height="${H}" fill="#1d5a35"/>${dots}
     ${photoSlot("#fffaf0","#1b1220")}
     <g>${g}</g>${dec}
     ${svgRacket(48,112,-38,.95,"#6f3e87")}${svgRacket(552,112,38,.95,"#6f3e87")}
     ${svgBow(300,62,1.3,"#d4262f")}
     ${svgShuttle(232,46,-100,.55,"#fff","#6f3e87")}${svgShuttle(368,46,100,.55,"#fff","#6f3e87")}
     ${svgGift(14,H-46,40,34,"#6f3e87","#f3cf7a")}${svgGift(546,H-46,40,34,"#d4262f","#f3cf7a")}`;
   }},
 { id:"snow", name:"D · Snow Ticket", sub:"Cream & gold rules, hanging ornaments, shuttle snowfall",
   art(){
     const r = rng(41); let fall="";
     for(let i=0;i<26;i++){ const x0=r()*W, y=90+r()*(H-120); if(x0>26&&x0<574&&y>52&&y<856) {i--; continue;}
       const x = x0 < W/2 ? Math.max(x0, 14) : Math.min(x0, W-14);   // keep each shuttle clear of the trimmed edge
       fall += r()<.5 ? svgShuttle(x,y,r()*360,.32+r()*.12,"#fff","#b8862b") : (r(), ""); }   /* snowflakes removed 2026-11-14; r() still consumed so the shuttles keep their places */
     const hang=[[118,56,"#d4262f",14],[205,44,"#b8862b",12],[395,44,"#2e7d4f",12],[482,56,"#d4262f",14]];   // strings long enough that every ball overlaps the headline ribbon
     return `
     <defs><pattern id="strings" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#fff"/><path d="M0 0H7M0 0V7" stroke="#cbb27a" stroke-width="1.2"/></pattern></defs>
     <rect width="${W}" height="${H}" fill="#fbf6ee"/>
     ${fall}
     <rect x="12" y="12" width="${W-24}" height="${H-24}" rx="22" fill="none" stroke="#b8862b" stroke-width="5"/>
     <rect x="22" y="22" width="${W-44}" height="${H-44}" rx="16" fill="none" stroke="#b8862b" stroke-width="1.8"/>
     ${photoSlot("#fff","#b8862b")}
     ${svgGift(36,H-50,36,30,"#2e7d4f","#f3cf7a")}${svgGift(528,H-50,36,30,"#6f3e87","#f3cf7a")}
     <!--OVER-->
     <g id="rkt">${svgRacket(RKT.snow.x,RKT.snow.y,RKT.snow.rot,RKT.snow.s,"#6f3e87")}</g>
     ${shuttles("snow")}
     <!--TOP-->
     ${hang.map(([x,len,c,rr])=>svgOrn(x,22+len+rr+6,rr,c,len)).join("")}
     ${svgBow(300,40,.9,"#6f3e87","#f3cf7a")}
`;
   }},
];

/* ---------- stats card (same content as the strip, sized for print) ---------- */
function panelHTML(){
  const head = `<div class="ph"><img src="${LOGO}" alt=""><div><h2>Anthony</h2><div class="tg">Badminton Tayo! · Xmas 2026</div></div>
    <div class="tt"><div><b>15</b><span>Places</span></div><div><b>11</b><span>Top 3</span></div><div><b class="g">8</b><span>1st</span></div></div></div>`;
  if (opts.stats === "hl") return head + `<div class="hl">
    <div class="p1"><em>1st</em><strong>18</strong><small>Win streak</small></div>
    <div class="p1"><em>1st</em><strong>81%</strong><small>Win rate</small></div>
    <div class="p1"><em>1st</em><strong>4</strong><small>Unbeaten partners</small></div>
    <div class="p1"><em>1st</em><strong>3.69</strong><small>Early Bird pts</small></div>
    <div class="p1"><em>1st</em><strong>32%</strong><small>Smooth Technique</small></div>
    <div class="p2"><em>2nd</em><strong>36%</strong><small>Fierce Offense</small></div></div>`;
  const row = (c,m,a,b) => `<tr class="${c}"><td><span class="m">${m}</span></td><td>${a}</td><td>${b}</td></tr>`;
  return head + `<div class="cols"><table><tr><th colspan="3">Awards · Win rate · Cheers</th></tr>
    ${row("p1","1st","Win Streak","18")}${row("p1","1st","Win Rate","81%")}${row("p1","1st","Early Bird","3.69")}
    ${row("p1","1st","Smooth Technique","32%")}${row("p2","2nd","Fierce Offense","36%")}${row("pn","5th","Most Sessions","15")}</table>
    <table><tr><th colspan="3">Partner win rate</th></tr>
    ${row("p1","1st","Steph · Mark","7–0 · 7–0")}${row("p1","1st","Bogs · Alex","6–0 · 4–0")}${row("p2","2nd","Wes","9–1")}
    ${row("p3","3rd","Caitlin","8–1")}${row("pn","6th","AJ","5–1")}${row("pn","9–10","Ronwald · Jerome","10–3 · 3–1")}</table></div>`;
}

function guidesSVG(){
  // trim = canvas edge; safe zone 0.1 in (30 px) inside; printers usually want 0.125 in bleed OUTSIDE the trim
  return `<svg class="guides" viewBox="0 0 ${W} ${H}"><rect x="30" y="30" width="${W-60}" height="${H-60}" fill="none" stroke="#00b7ff" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="40" y="${H-40}" fill="#00b7ff" font-size="18" font-weight="700">safe zone 0.1 in</text></svg>`;
}

/* ---------- render ---------- */
const pt = px => (px/300*72).toFixed(1);
function render(){
  const scale = opts.size === "fit" ? .66 : 192/600;  // CSS inch = 96 px, so 2 in = 192 px (approximate on real screens)
  document.getElementById("grid").innerHTML = THEMES.filter(t => SHOW.includes(t.id)).map(t => `
    <figure><div class="box" style="width:${W*scale}px;height:${H*scale}px">
      <div class="mag" style="transform:scale(${scale})">
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${t.art()}</svg>
        ${opts.stats==="off" ? "" : `<div class="panel">${panelHTML()}</div>`}
        ${opts.guide==="on" ? guidesSVG() : ""}
      </div></div>
      <figcaption><b>${t.name}</b><span>${t.sub}</span><br><button class="dl" data-t="${t.id}">Download frame PNG (photo window transparent)</button></figcaption></figure>`).join("");
  const rowPx = opts.stats === "hl" ? 19 : 15.5;
  document.getElementById("note").innerHTML =
    `Frame is <b>600 × 900 px = 2 × 3 in at 300 dpi</b>. Photo window ${PHOTO.w} × ${PHOTO.h} px (${(PHOTO.w/300).toFixed(2)} × ${(PHOTO.h/300).toFixed(2)} in). ` +
    (opts.stats === "off" ? `Stats card is optional — switch it on to preview how your leaderboard strip sits on the frame.`
      : `With the card at this size: name <b>${pt(36)} pt</b>, numbers <b>${pt(40)} pt</b>, labels <b>${pt(rowPx)} pt</b>` +
        (opts.stats === "hl" ? ` — small but readable up close.` : ` — <b>below ~5 pt, hard to read on a magnet</b>.`));
}
function exportSVG(t){
  HOLE = true; const [under, over = ""] = t.art().split("<!--OVER-->"); HOLE = false; const p = PHOTO;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <mask id="hole"><rect width="${W}" height="${H}" fill="#fff"/><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.r}" fill="#000"/></mask>
    <g mask="url(#hole)">${under}</g>${over}</svg>`;
}
document.getElementById("grid").addEventListener("click", e => {
  const b = e.target.closest(".dl"); if (!b) return;
  const t = THEMES.find(x => x.id === b.dataset.t);
  const svg = exportSVG(t);
  const img = new Image();
  img.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(img,0,0);
    const a = document.createElement("a"); a.download = `ref-magnet-frame-${t.id}.png`; a.href = c.toDataURL("image/png"); a.click(); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
});
for (const [id,key] of [["sStats","stats"],["sSize","size"],["sGuide","guide"]]) {
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    opts[key] = b.dataset.v;
    for (const x of e.currentTarget.querySelectorAll("button")) x.setAttribute("aria-pressed", x===b);
    render();
  });
}
render();
</script>
</body>
</html>
